<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Md. Mahiul Kabir banner">
  <title>Md. Mahiul Kabir</title>
  <rect x="0" y="0" width="1200" height="260" rx="18" fill="#181825"/>

  <circle cx="34" cy="30" r="6" fill="#f38ba8"/>
  <circle cx="56" cy="30" r="6" fill="#f9e2af"/>
  <circle cx="78" cy="30" r="6" fill="#a6e3a1"/>
  <line x1="20" y1="50" x2="1180" y2="50" stroke="#a6adc8" stroke-width="1" opacity="0.15"/>

  <text x="40" y="100" font-family="'Fira Code', Consolas, monospace" font-size="15" fill="#a6e3a1" opacity="0.85">visitor@rbwkai:~$ whoami</text>
  <text x="40" y="155" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#cdd6f4">Md. Mahiul Kabir</text>

  <defs>
    <clipPath id="clipW1"><rect x="40" y="172" width="0" height="30"><animate id="w1type" attributeName="width" from="0" to="290" dur="1.3s" begin="0.4s;w3del.end+0.4s" fill="freeze"/><animate id="w1del" attributeName="width" from="290" to="0" dur="0.7s" begin="w1type.end+1.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="clipW2"><rect x="40" y="172" width="0" height="30"><animate id="w2type" attributeName="width" from="0" to="92" dur="0.9s" begin="w1del.end+0.4s" fill="freeze"/><animate id="w2del" attributeName="width" from="92" to="0" dur="0.6s" begin="w2type.end+1.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="clipW3"><rect x="40" y="172" width="0" height="30"><animate id="w3type" attributeName="width" from="0" to="79" dur="0.8s" begin="w2del.end+0.4s" fill="freeze"/><animate id="w3del" attributeName="width" from="79" to="0" dur="0.6s" begin="w3type.end+1.0s" fill="freeze"/></rect></clipPath>
  </defs>

  <text x="40" y="196" font-family="'Fira Code', Consolas, monospace" font-size="22" fill="#cba6f7" clip-path="url(#clipW1)">Competitive Programmer</text>
  <text x="40" y="196" font-family="'Fira Code', Consolas, monospace" font-size="22" fill="#94e2d5" clip-path="url(#clipW2)">Athlete</text>
  <text x="40" y="196" font-family="'Fira Code', Consolas, monospace" font-size="22" fill="#fab387" clip-path="url(#clipW3)">Artist</text>

  <rect x="40" y="176" width="3" height="24" fill="#cdd6f4">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="x" from="40" to="330" dur="1.3s" begin="0.4s;w3del.end+0.4s" fill="freeze"/>
    <animate attributeName="x" from="330" to="40" dur="0.7s" begin="w1type.end+1.0s" fill="freeze"/>
    <animate attributeName="x" from="40" to="132" dur="0.9s" begin="w1del.end+0.4s" fill="freeze"/>
    <animate attributeName="x" from="132" to="40" dur="0.6s" begin="w2type.end+1.0s" fill="freeze"/>
    <animate attributeName="x" from="40" to="119" dur="0.8s" begin="w2del.end+0.4s" fill="freeze"/>
    <animate attributeName="x" from="119" to="40" dur="0.6s" begin="w3type.end+1.0s" fill="freeze"/>
  </rect>

  <text x="1160" y="235" text-anchor="end" font-family="'Fira Code', Consolas, monospace" font-size="12" fill="#a6adc8" opacity="0.45">~/rbwkai</text>
</svg>
